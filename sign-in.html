<body>
    <div class="container">
    <div class="tab">
      <a class="active" href="sign-in.html"><button >Login</button></a>
      <a id="signupBtn" href="signup.html"><button >Signup</button></a>
    </div>
        <form class="login" action="index.html" method="get">
            <div class="field">
                <label for="username">username</label>
                <br>
                <input type="text" id="username" name="username" required>
                <br>
                <label for="password">password</label>
                <br>
                <input type="password" id="password" name="password" required>
                <br>
                 <a href="index.html"><button type="submit" class="login-button">login</button></a>
                 <p class="signup-text">Not a member? </p>
                    <a class="signup-text" href="signup.html">Signup now</a>
            </div>
        </form>
    </div>
</body>
